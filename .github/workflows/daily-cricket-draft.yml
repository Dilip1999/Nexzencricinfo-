name: Daily Cricket News and Instagram

on:
  schedule:
    - cron: "30 6 * * *" # 11:30 AM IST
    - cron: "30 11 * * *" # 4:30 PM IST
    - cron: "30 16 * * *" # 9:30 PM IST
  workflow_dispatch:
    inputs:
      publishing_mode:
        description: "Choose regular coverage, breaking news, or a Reel preview"
        required: true
        type: choice
        options:
          - regular
          - breaking_news
          - reels
        default: regular

permissions:
  contents: write

concurrency:
  group: nexzen-cricket-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Determine publishing slot
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "30 6 * * *" ]; then SLOT=morning
          elif [ "$SCHEDULE" = "30 11 * * *" ]; then SLOT=evening
          elif [ "$SCHEDULE" = "30 16 * * *" ]; then SLOT=night
          else
            HOUR=$(TZ=Asia/Kolkata date +%H)
            if [ "$HOUR" -lt 14 ]; then SLOT=morning
            elif [ "$HOUR" -lt 19 ]; then SLOT=evening
            else SLOT=night
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Publishing slot: $SLOT"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Clean existing images for this slot
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          DIR="images/$TODAY/$POST_SLOT"
          if [ -d "$DIR" ]; then
            rm -rf "$DIR"
            echo "Removed old generated images from $DIR"
          else
            echo "No old images found in $DIR"
          fi
      - name: Generate engaging cricket carousel
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          PUBLISHING_MODE: ${{ inputs.publishing_mode || (github.event_name == 'schedule' && 'reels') || 'regular' }}
          OPENCRICKET_API_KEY: ${{ secrets.OPENCRICKET_API_KEY }}
        run: python cricket_agent.py
      - name: Verify complete carousel assets
        id: carousel
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          DIR="images/$TODAY/$POST_SLOT"
          DRAFT="drafts/${TODAY}_${POST_SLOT}.md"
          READY=true

          for i in 1 2 3 4 5 6; do
            FILE="$DIR/slide-$i.jpg"
            if [ ! -s "$FILE" ]; then
              echo "Carousel is incomplete: missing or empty $FILE"
              READY=false
            fi
          done

          if [ ! -s "$DRAFT" ]; then
            echo "Carousel draft is missing or empty: $DRAFT"
            READY=false
          fi

          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" = "true" ]; then
            echo "All six slides and the matching draft are ready."
          else
            echo "Skipping Instagram publishing because no complete carousel was generated."
          fi
      - name: Install FFmpeg for Reel rendering
        if: (github.event_name == 'schedule' || inputs.publishing_mode == 'reels') && steps.carousel.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Render vertical Reel preview
        if: (github.event_name == 'schedule' || inputs.publishing_mode == 'reels') && steps.carousel.outputs.ready == 'true'
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          python create_reel.py --date "$TODAY" --slot "$POST_SLOT" --audio positive_sound-cricket-487179.mp3
      - name: Upload generated Reel preview
        if: (github.event_name == 'schedule' || inputs.publishing_mode == 'reels') && steps.carousel.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nexzencricinfo-reel-preview
          path: videos/
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated draft and images
        run: |
          git add drafts/ images/ videos/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate cricket news carousel"
            git push
          fi
      - name: Publish to Instagram
        id: instagram
        if: github.event_name != 'schedule' && inputs.publishing_mode != 'reels' && vars.ENABLE_INSTAGRAM_PUBLISH == 'true' && steps.carousel.outputs.ready == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          FORCE_PUBLISH: ${{ inputs.publishing_mode == 'breaking_news' }}
        run: python publish_instagram.py
      - name: Publish Instagram Reel
        id: instagram_reel
        if: (github.event_name == 'schedule' || inputs.publishing_mode == 'reels') && vars.ENABLE_INSTAGRAM_PUBLISH == 'true' && steps.carousel.outputs.ready == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: python publish_instagram_reel.py
      - name: Commit Instagram Reel publication record
        if: vars.ENABLE_INSTAGRAM_PUBLISH == 'true' && steps.instagram_reel.outputs.status == 'published'
        run: |
          git add posted.json
          if git diff --cached --quiet; then
            echo "No Reel publication record change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Instagram Reel publication"
            git push
          fi
      - name: Remove published carousel images from repository
        if: vars.ENABLE_INSTAGRAM_PUBLISH == 'true' && steps.instagram.outputs.status == 'published'
        run: |
          # publish_instagram.py removes the local slide directory after a
          # successful post, so stage image changes even when that directory
          # no longer exists in the working tree.
          git add -A images/
          if git diff --cached --quiet; then
            echo "No carousel image files to remove."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Clean up published carousel images"
            git push
          fi
      - name: Commit Instagram publication record
        if: vars.ENABLE_INSTAGRAM_PUBLISH == 'true' && steps.instagram.outputs.status == 'published'
        run: |
          git add posted.json content_history.json
          if git diff --cached --quiet; then
            echo "No publication record change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Instagram publication and content history"
            git push
          fi

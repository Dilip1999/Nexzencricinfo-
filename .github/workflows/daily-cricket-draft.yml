name: Daily Cricket News and Instagram

on:
  schedule:
    - cron: "0 6 * * *"  # 11:30 AM IST
    - cron: "0 11 * * *" # 4:30 PM IST
    - cron: "0 16 * * *" # 9:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexzen-cricket-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Determine publishing slot
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 6 * * *" ]; then SLOT=morning
          elif [ "$SCHEDULE" = "0 11 * * *" ]; then SLOT=evening
          elif [ "$SCHEDULE" = "0 16 * * *" ]; then SLOT=night
          else
            HOUR=$(TZ=Asia/Kolkata date +%H)
            if [ "$HOUR" -lt 14 ]; then SLOT=morning
            elif [ "$HOUR" -lt 19 ]; then SLOT=evening
            else SLOT=night
            fi
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "Publishing slot: $SLOT"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate engaging cricket carousel
        env:
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          OPENCRICKET_API_KEY: ${{ secrets.OPENCRICKET_API_KEY }}
        run: python cricket_agent.py
      - name: Commit generated draft and images
        run: |
          git add drafts/ images/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate cricket news carousel"
            git push
          fi
      - name: Publish to Instagram
        id: instagram
        if: vars.ENABLE_INSTAGRAM_PUBLISH == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          POST_SLOT: ${{ steps.slot.outputs.slot }}
        run: python publish_instagram.py
      - name: Remove published carousel images from repository
        if: vars.ENABLE_INSTAGRAM_PUBLISH == 'true' && steps.instagram.outputs.status == 'published'
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          TODAY=$(TZ=Asia/Kolkata date +%F)
          DIR="images/$TODAY/$SLOT"
          if [ -d "$DIR" ]; then
            rm -rf "$DIR"
            git add -A images/
            if git diff --cached --quiet; then
              echo "No carousel image files to remove."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Clean up published carousel images"
              git push
            fi
          else
            echo "No published carousel image directory found."
          fi
      - name: Commit Instagram publication record
        if: vars.ENABLE_INSTAGRAM_PUBLISH == 'true'
        run: |
          git add posted.json content_history.json
          if git diff --cached --quiet; then
            echo "No publication record change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record Instagram publication and content history"
            git push
          fi

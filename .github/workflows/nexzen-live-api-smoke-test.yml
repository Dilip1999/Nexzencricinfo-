name: NexZen QA Live Cricket Database Smoke Test

on:
  push:
    branches: [QA]
    paths:
      - 'nexzen/smoke_test.py'
      - '.github/workflows/nexzen-live-api-smoke-test.yml'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout QA
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependency
        run: python -m pip install requests
      - name: Test free-tier match listing
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: python -m nexzen.smoke_test

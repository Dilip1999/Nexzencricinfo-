name: NexZenCricInfo QA Sample Reels

on:
  push:
    branches: [QA]
    paths:
      - 'nexzen/sample_reels.py'
      - 'tests/test_sample_reels.py'
      - '.github/workflows/nexzen-sample-reels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-sample-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and rendering dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'Pillow>=10,<13'
      - name: Download featured player photo selected by story fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import urllib.request
          fixture = json.loads(Path("nexzen/fixtures/india_nz_1st_odi_2026_sample.json").read_text())
          image = fixture["featured_player_image"]
          target = Path("nexzen") / image["asset"]
          target.parent.mkdir(parents=True, exist_ok=True)
          request = urllib.request.Request(image["source_url"], headers={"User-Agent": "NexZenCricInfo-QA/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()
          if not data or len(data) < 10000:
              raise SystemExit("Featured player image download is empty or unexpectedly small")
          target.write_bytes(data)
          print(f"Downloaded {image['player']} background image ({len(data)} bytes)")
          PY
      - name: Run sample Reel tests
        run: python -m unittest tests.test_sample_reels -v
      - name: Render one selected India vs New Zealand story Reel
        run: python -m nexzen.sample_reels
      - name: Upload QA sample batch
        uses: actions/upload-artifact@v4
        with:
          name: nexzen-india-nz-selective-story-qa
          path: qa-sample-reels/
          if-no-files-found: error
          retention-days: 7

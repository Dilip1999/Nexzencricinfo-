name: NexZenCricInfo QA Sample Reels

on:
  push:
    branches: [QA]
    paths:
      - 'nexzen/sample_reels.py'
      - 'tests/test_sample_reels.py'
      - '.github/workflows/nexzen-sample-reels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-sample-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and rendering dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install 'Pillow>=10,<13'
      - name: Download attributed Virat Kohli background photo
        run: |
          mkdir -p nexzen/assets/players
          curl -fL --retry 3 "https://upload.wikimedia.org/wikipedia/commons/6/6e/Virat_Kohli_Batting_%28cropped%29.jpg" -o nexzen/assets/players/virat_kohli.jpg
      - name: Run sample Reel tests
        run: python -m unittest tests.test_sample_reels -v
      - name: Render one selected India vs New Zealand story Reel
        run: python -m nexzen.sample_reels
      - name: Upload QA sample batch
        uses: actions/upload-artifact@v4
        with:
          name: nexzen-india-nz-selective-story-qa
          path: qa-sample-reels/
          if-no-files-found: error
          retention-days: 7

name: NexZen QA Scorecard Data Pipeline

on:
  push:
    branches: [QA]
    paths:
      - 'nexzen/fetch_sample.py'
      - 'nexzen/scorecard_analysis.py'
      - 'nexzen/quality_gate.py'
      - 'nexzen/providers/cricketdata.py'
      - 'tests/test_scorecard_analysis.py'
      - 'tests/test_quality_gate.py'
      - '.github/workflows/nexzen-scorecard-qa.yml'

permissions:
  contents: read

jobs:
  scorecard-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Run scorecard and quality gate tests
        run: |
          python -m unittest tests.test_scorecard_analysis -v
          python -m unittest tests.test_quality_gate -v
      - name: Fetch and validate one recent scorecard using QA secret
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
        run: python -m nexzen.fetch_sample --out qa-output
      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexzen-sample-scorecard-analysis
          path: qa-output/sample-scorecard-analysis.json
          if-no-files-found: error
          retention-days: 7

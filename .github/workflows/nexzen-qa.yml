name: NexZenCricInfo QA Checks

on:
  workflow_dispatch:
  push:
    branches: [QA]
    paths:
      - 'nexzen/**'
      - 'tests/**'
      - '.github/workflows/nexzen-qa.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Run NexZen editorial quality tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q nexzen tests
